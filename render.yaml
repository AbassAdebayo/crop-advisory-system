# ============================================================
# Render Blueprint - Crop Advisory System (CAS)
# https://render.com/docs/blueprint-spec
#
# Deploy: Connect this repo on Render and use "Apply Blueprint"
# or push this file and let Render auto-detect it.
# ============================================================

services:
  # ----------------------------------------------------------
  # Web service - ASP.NET Core MVC application
  # ----------------------------------------------------------
  - type: web
    name: cas-web
    runtime: docker
    plan: free                   
    region: oregon   
    branch: master  
    dockerfilePath: ./Dockerfile
    dockerContext: . 

 

    # Environment variables (set secrets in the Render dashboard)
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_URLS
        value: http://+:8080
# ------------------------------------------------------------
# Managed PostgreSQL database
# ------------------------------------------------------------
# Link environment variable to your Render database
    envVars:
      - key: ConnectionStrings__CASConnection
        fromDatabase:
          name: cas-db 
          property: connectionString

# Define the PostgreSQL database
databases:
  - name: cas-db
    databaseName: cas_db_wmzy
    user: cas_db_wmzy_user
    plan: free
    region: oregon
